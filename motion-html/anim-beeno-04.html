function cl(v,a,b){return v<a?a:(v>b?b:v)}
function oCubic(x){x=cl(x,0,1);return 1-Math.pow(1-x,3)}
function ioCubic(x){x=cl(x,0,1);return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function oBack(x,c){x=cl(x,0,1);c=c||1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}
function mix(a,b,p){return [a[0]+(b[0]-a[0])*p,a[1]+(b[1]-a[1])*p,a[2]+(b[2]-a[2])*p]}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+cl(a,0,1).toFixed(3)+')'}
function lerp(a,b,p){return a+(b-a)*p}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function bez(x1,y1,x2,y2){
  function A(a,b){return 1-3*b+3*a} function B(a,b){return 3*b-6*a} function C(a){return 3*a}
  function f(t,a,b){return ((A(a,b)*t+B(a,b))*t+C(a))*t}
  function d(t,a,b){return 3*A(a,b)*t*t+2*B(a,b)*t+C(a)}
  return function(x){ if(x<=0)return 0; if(x>=1)return 1; var t=x;
    for(var i=0;i<8;i++){var s=d(t,x1,x2); if(!s)break; t-=(f(t,x1,x2)-x)/s;}
    return f(t,y1,y2); };
}
var eB=bez(.22,1,.36,1), REV=0.70;
function show(el,t,T){ var p=eB((t-T)/REV); el.style.opacity=p.toFixed(3);
  el.style.transform='translateY('+(28*(1-p)).toFixed(2)+'px)'; }
function hide(el,t,T){ if(t<T) return; var p=oCubic((t-T)/0.40);
  el.style.opacity=(parseFloat(el.style.opacity||1)*(1-p)).toFixed(3);
  el.style.transform='translateY('+(-26*p).toFixed(2)+'px)'; }

function box(x,y,w,h,r,fill,stroke,lw){ rr(x,y,w,h,r);

function brl(n){ var s=n.toFixed(2).split('.'), i=s[0], o='';
  while(i.length>3){o='.'+i.slice(-3)+o; i=i.slice(0,-3);} return 'R$ '+i+o+','+s[1]; }

/* ---- camera: ponto (cx,cy) do mundo vai pra (540,sy) na tela com escala s ---- */
function camOn(c){ctx.save();ctx.translate(540,c.sy);ctx.scale(c.s,c.s);ctx.translate(-c.cx,-c.cy);}
function scr(c,x,y){return {x:540+(x-c.cx)*c.s, y:c.sy+(y-c.cy)*c.s}}
function lcam(a,b,p){return {s:lerp(a.s,b.s,p),cx:lerp(a.cx,b.cx,p),cy:lerp(a.cy,b.cy,p),sy:lerp(a.sy,b.sy,p)}}

/* ---- logos (mesmo tratamento da peca 02) ---- */
var LOGO={};
function prep(im,mode){
  var c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
  var g=c.getContext('2d'); g.drawImage(im,0,0);
  var d=g.getImageData(0,0,c.width,c.height), p=d.data, x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(var i=0;i<p.length;i+=4){
    var r=p[i],gg=p[i+1],b=p[i+2],a=p[i+3];
    if(mode==='blip'){
      var mx=Math.max(r,gg,b), mn=Math.min(r,gg,b), lum=(r+gg+b)/3;
      if(mx-mn<30){ var na=cl((247-lum)/247,0,1); if(na<0.03) na=0;
        p[i]=255;p[i+1]=255;p[i+2]=255;p[i+3]=(na*255)|0; }
      else { var dd=Math.max(Math.abs(r-247),Math.abs(gg-247),Math.abs(b-247));
        p[i]=1;p[i+1]=150;p[i+2]=250;p[i+3]=(cl(dd/55,0,1)*255)|0; }
    } else { var l2=(r+gg+b)/3; p[i]=255;p[i+1]=255;p[i+2]=255;p[i+3]=(a*(l2/255))|0; }
    if(p[i+3]>12){ var px=(i/4)%c.width, py=((i/4)/c.width)|0;
      if(px<x0)x0=px; if(px>x1)x1=px; if(py<y0)y0=py; if(py>y1)y1=py; }
  }
  g.putImageData(d,0,0);
  return {c:c,x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
}
/* versao "escura" da logo da Blip pra fundo branco: wordmark volta a ser preto */
function darkBlip(L){
  var c=document.createElement('canvas'); c.width=L.c.width; c.height=L.c.height;
  var g=c.getContext('2d'); g.drawImage(L.c,0,0);
  var d=g.getImageData(0,0,c.width,c.height), p=d.data;
  for(var i=0;i<p.length;i+=4){ if(p[i]===255&&p[i+1]===255){p[i]=17;p[i+1]=17;p[i+2]=17;} }
  g.putImageData(d,0,0); return {c:c,x:L.x,y:L.y,w:L.w,h:L.h};
}
function logo(L,cx,cy,tw,al){ if(!L||al<=0.003) return; var s=tw/L.w, th=L.h*s;

  ctx.drawImage(L.c,L.x,L.y,L.w,L.h,cx-tw/2,cy-th/2,tw,th); ctx.globalAlpha=ga; }
